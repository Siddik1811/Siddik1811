<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c"><rect width="1000" height="280" rx="20"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#0f1b3d"/>
      <stop offset="1" stop-color="#1a0f3d"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00f7ff" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <g clip-path="url(#c)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
 
    <!-- glowing orbs -->
    <circle r="90" cy="90" fill="#00f7ff" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="120;380;120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="100" cy="170" fill="#bb9af7" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cx" values="880;620;880" dur="11s" repeatCount="indefinite"/>
    </circle>
 
    <!-- floating code symbols -->
    <g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#00f7ff">
      <text x="70" y="70" font-size="34" opacity="0.25">&lt;/&gt;
        <animate attributeName="y" values="70;50;70" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="880" y="80" font-size="40" opacity="0.25" fill="#bb9af7">{ }
        <animate attributeName="y" values="80;58;80" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="150" y="215" font-size="30" opacity="0.2" fill="#7aa2f7">=&gt;
        <animate attributeName="y" values="215;195;215" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="830" y="215" font-size="30" opacity="0.2">[ ]
        <animate attributeName="y" values="215;193;215" dur="5.5s" repeatCount="indefinite"/>
      </text>
      <text x="470" y="55" font-size="22" opacity="0.18" fill="#bb9af7">01
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
      </text>
    </g>
 
    <!-- name -->
    <g filter="url(#glow)">
      <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="4" fill="url(#txt)" opacity="0">
        PATHAN MOHMAD SIDDIK
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="1.2s" fill="freeze"/>
      </text>
    </g>
 
    <!-- subtitle -->
    <text x="500" y="176" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#00f7ff" opacity="0">
      &lt; Full-Stack Web &amp; Mobile Developer /&gt;
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1s" fill="freeze"/>
    </text>
 
    <!-- tech line -->
    <text x="500" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" letter-spacing="3" fill="#9aa4b2" opacity="0">
      REACT  •  NODE.JS  •  FLUTTER  •  MONGODB  •  FIREBASE
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="1s" fill="freeze"/>
    </text>
 
    <!-- animated waves -->
    <path fill="url(#w1)" d="M0 250 C250 220 250 280 500 250 C750 220 750 280 1000 250 C1250 220 1250 280 1500 250 C1750 220 1750 280 2000 250 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w2)" d="M0 258 C250 238 250 278 500 258 C750 238 750 278 1000 258 C1250 238 1250 278 1500 258 C1750 238 1750 278 2000 258 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
 
  <rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="#00f7ff" stroke-opacity="0.25"/>
</svg>
 
